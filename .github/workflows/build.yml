name: Windows exe derle
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --clean --noconfirm --onefile --windowed --name GitHubProfilAnaliz main.py
      - uses: actions/upload-artifact@v4
        with:
          name: GitHubProfilAnaliz
          path: dist/GitHubProfilAnaliz.exe
