name: Windows exe derle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller -r requirements.txt
      - run: python tests/smoke_ai.py
      - run: pyinstaller --clean --noconfirm --onefile --windowed --name GitHubProfilAnaliz main.py
      - uses: actions/upload-artifact@v4
        with:
          name: GitHubProfilAnaliz
          path: dist/GitHubProfilAnaliz.exe
      - name: Release oluştur (main'e her gönderimde yeni sürüm)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: v1.0.${{ github.run_number }}
          make_latest: true
          files: dist/GitHubProfilAnaliz.exe
          body: |
            GitHubProfilAnaliz.exe dosyasını indirip çift tıklayarak çalıştır (kurulum gerekmez).
            Windows "bilinmeyen yayıncı" uyarısı verirse: Ek bilgi → Yine de çalıştır.
