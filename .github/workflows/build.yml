name: Windows exe derle
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --clean --noconfirm --onefile --windowed --name GitHubProfilAnaliz main.py
      - uses: actions/upload-artifact@v4
        with:
          name: GitHubProfilAnaliz
          path: dist/GitHubProfilAnaliz.exe
      - name: Release oluştur (yalnızca v* etiketlerinde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GitHubProfilAnaliz.exe
          body: |
            GitHubProfilAnaliz.exe dosyasını indirip çift tıklayarak çalıştır (kurulum gerekmez).
            Windows "bilinmeyen yayıncı" uyarısı verirse: Ek bilgi → Yine de çalıştır.
